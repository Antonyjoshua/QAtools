                - textbox "Rules from the selected prompt config are loaded here. You can edit or add more instructions." [ref=f10e265]: "### MATCH THE FOLLOWING LAYOUT (STRICT) If the uploaded question is a \"Match the Following\" question, NEVER convert it into a normal vertical list. Preserve the original two-column layout exactly as shown. The output must visually resemble the original question paper. நான் Upload செய்யும் Image / PDF / Screenshot / Video Frame-ல் உள்ள Questions-ஐ மட்டும் எடுத்துக் கொள்ள வேண்டும். Extra Question உருவாக்கக்கூடாது.Sample Question சேர்க்கக்கூடாது.Uploaded Content-ல் இல்லாத எந்த Question-யும் சேர்க்கக்கூடாது. ### Question Format Question-ஐ Mobile App-க்கு Clear-ஆ தெரியும் Format-ல் மாற்றி கொடுக்க வேண்டும். Statement Question என்றால்: Question Heading I. Statement 1 II. Statement 2 III. Statement 3 IV. Statement 4 Options:(A) Option A(B) Option B(C) Option C(D) Option D ### Match the Following Question என்றால் இந்த Format மட்டும் பயன்படுத்த வேண்டும்: Question Heading List I (a) Item 1(b) Item 2(c) Item 3(d) Item 4 List II 1. Item 12. Item 23. Item 34. Item 4 Options:(A) (a)-4 (b)-3 (c)-2 (d)-1(B) (a)-1 (b)-2 (c)-3 (d)-4(C) (a)-2 (b)-3 (c)-4 (d)-1(D) (a)-3 (b)-2 (c)-1 (d)-4 ### Bilingual Rule முதலில் Tamil Question கொடுக்க வேண்டும்.அதற்கு கீழே English Question கொடுக்க வேண்டும். Tamil மற்றும் English இரண்டிலும் ஒரே Format இருக்க வேண்டும். ### Option Rule Options-ஐ தனித்தனி Option A, Option B, Option C, Option D ஆக கொடுக்க வேண்டும். Option Text-ஐ மாற்றக்கூடாது.Option Order-ஐ மாற்றக்கூடாது. ### Answer Correct Answer-ஐ தெளிவாக கொடுக்க வேண்டும். ### Solution Rule Solution Paragraph ஆக இருக்கக்கூடாது. Solution 4 முதல் 6 Bullet Points மட்டும் இருக்க வேண்டும். ஒவ்வொரு Point-மும் தனித்தனி Line-ல் இருக்க வேண்டும். Solution Format: • Correct Answer ஏன் சரி என்பதை சொல்ல வேண்டும்.• Question-க்கு தொடர்பான முக்கிய Concept சொல்ல வேண்டும்.• தேவையான Year / Article / Person / Institution இருந்தால் குறிப்பிட வேண்டும்.• மற்ற Options ஏன் தவறு என்பதை சுருக்கமாக சொல்ல வேண்டும்.• Exam Point of View-ல் நினைவில் வைத்துக்கொள்ள வேண்டிய முக்கிய தகவலை சொல்ல வேண்டும். ### Strict Rule Question-ல் உள்ள I, II, III, IV Statements எல்லாம் Question Field-க்குள் வர வேண்டும். Match the Following Questions-ல் List I மற்றும் List II Mobile-friendly Format-ல் வர வேண்டும். Do not use two-column layout for Match the Following. Do not create extra questions. Do not skip any visible question. Do not write long paragraph solutions. Output clean, neat, app-friendly and easy to read. ### SOLUTION FORMATTING RULE (STRICT) Solution MUST NOT be written as a paragraph. Every explanation must be on a separate bullet point. Each bullet point must contain only ONE idea. Leave one blank line between every bullet point for better readability. ### SOLUTION FORMAT (STRICT) The solution must contain ONLY important factual points related to the correct answer. Do NOT use headings such as: ❌ Why is it correct?❌ Concept❌ Why are the other options wrong?❌ Conclusion❌ Exam Point❌ Notes❌ Explanation Instead, generate ONLY 4 to 6 short bullet points. Each bullet point must contain one important fact. Every bullet point must be independent. Do not repeat the same information in different words. Do not explain the question again. Do not explain why the wrong options are wrong unless absolutely necessary. Focus only on the most important exam-related facts connected to the correct answer. Each bullet point should be one or two short lines only. Example: • இந்திய அரசியலமைப்பின் Article 64 படி, துணைக் குடியரசுத் தலைவர் மாநிலங்களவையின் பதவிவழித் தலைவராக செயல்படுகிறார். • Article 89(1) மாநிலங்களவையின் தலைவராக துணைக் குடியரசுத் தலைவர் செயல்படுவதை உறுதி செய்கிறது. • துணைக் குடியரசுத் தலைவர் Article 66-ன் படி, நாடாளுமன்றத்தின் இரு அவைகளின் தேர்ந்தெடுக்கப்பட்ட உறுப்பினர்களைக் கொண்ட தேர்தல் கல்லூரியால் தேர்ந்தெடுக்கப்படுகிறார். • மாநிலங்களவை உறுப்பினர்களால் மட்டும் அவர் தேர்ந்தெடுக்கப்படுவதில்லை. • TNPSC தேர்வில் Article 64, 66 மற்றும் 89(1) அடிக்கடி கேட்கப்படும் முக்கிய அரசியலமைப்பு பிரிவுகளாகும். ### SOLUTION ORGANIZATION (STRICT) Do NOT write the solution as a continuous paragraph. Split the solution into logical reading points. Each point must contain only one complete idea. Leave one blank line after every point. Do NOT merge multiple concepts into a single paragraph. Arrange the explanation in the following logical order: • Correct answer • First important fact • Second important fact • Third important fact • Related Article / Year / Person (if applicable) • Final conclusion Every point must be short, clean, and easy to read on a mobile screen. The solution should look like organized study notes, not like a paragraph from a textbook. சரியான விடை : (A) • கூற்று (A) சரியானது. • இந்திய அரசியலமைப்பின் Article 64-ன் படி, துணைக் குடியரசுத் தலைவர் மாநிலங்களவையின் பதவிவழித் தலைவராக செயல்படுகிறார். • Article 89(1)-ம் இதையே உறுதிப்படுத்துகிறது. • காரணம் (R) தவறானது. • துணைக் குடியரசுத் தலைவர் மாநிலங்களவை உறுப்பினர்களால் மட்டும் தேர்ந்தெடுக்கப்படுவதில்லை. • Article 66-ன் படி, நாடாளுமன்றத்தின் இரு அவைகளின் தேர்ந்தெடுக்கப்பட்ட உறுப்பினர்களைக் கொண்ட தேர்தல் கல்லூரியால் தேர்ந்தெடுக்கப்படுகிறார். • எனவே, கூற்று (A) சரியானது; ஆனால் காரணம் (R) தவறானது."
