          - generic [ref=f40e114]:
            - paragraph [ref=f40e115]:
              - strong [ref=f40e116]: TNPSC அடிப்படை பயிற்சி வகுப்பு
              - text: என்பது TNPSC குரூப் 1, 2, 2A மற்றும் 4 தேர்வுகளை இலக்காகக் கொண்டு முழுமையான மற்றும் கட்டமைக்கப்பட்ட பயிற்சித் திட்டமாகும். இந்தப் பயிற்சி வகுப்பு, தொடக்கநிலை மற்றும் இடைநிலை மாணவர்களுக்காகச் சிறப்பாக வடிவமைக்கப்பட்டுள்ளது.
            - paragraph [ref=f40e117]: இதில், பொதுத்திறன், எண்ணியல், மொழித் திறன் (தமிழ்/ஆங்கிலம்) ஆகியவை முழுமையாகக் கற்பிக்கப்படுகின்றன. தமிழக வரலாறு, பண்பாடு, சமூக அமைப்பு மற்றும் நிர்வாக மேம்பாடுகள் ஆகியவற்றிற்கு சிறப்பு முக்கியத்துவம் அளிக்கப்படுகிறது.
            - paragraph [ref=f40e118]:
              - strong [ref=f40e119]: "சிறப்பம்சங்கள்:"
            - paragraph [ref=f40e120]:
              - strong [ref=f40e121]: பயிற்சி காலம்
              - text: – 12 மாதங்களுக்கு மேல், வாரத்தில் 6 நாட்கள் வகுப்புகள்
              - strong [ref=f40e122]: மொத்த வகுப்புகள்
              - text: – 230+ கட்டமைக்கப்பட்ட நேரடி வகுப்புகள்
              - strong [ref=f40e123]: மொழி
              - text: – இருமொழி (தமிழ் & ஆங்கிலம்) - தமிழ் வழிக் கற்றலுக்கு முக்கியத்துவம்
              - strong [ref=f40e124]: ஆன்லைன் அணுகல்
              - text: – 24/7 பதிவு செய்யப்பட்ட வகுப்புகள் (மீண்டும் பார்க்க வசதி)
              - strong [ref=f40e125]: பயிற்சி தேர்வுகள்
              - text: – 75+ ஆன்லைன் பயிற்சித் தேர்வுகள் (குரூப் 1 & 2)
              - strong [ref=f40e126]: வழிகாட்டுதல்
