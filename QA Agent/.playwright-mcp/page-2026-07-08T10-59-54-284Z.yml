                - textbox "Rules from the selected prompt config are loaded here. You can edit or add more instructions." [ref=f12e269]: "We have uploaded a PDF file. Please create a set of 10 questions based on the example provided in this PDF, strictly adhering to the exact pattern of that question. Additionally, the explanations for these questions must be provided clearly, just as they are presented in the uploaded document. Generate a total of 10 questions. All questions must be analytical, conceptual, and exam-oriented, similar to actual TNPSC Group 1 Preliminary examination questions. Important Instructions: • All questions must be in bilingual format. • The complete question must appear first in Tamil. • Immediately below that, the same question must appear in English. • Do NOT use headings such as “Tamil” or “English”. • The format must be clean and copy-paste friendly. • Questions must follow proper TNPSC exam style formatting. • Both Assertion and Reason statements must be meaningful, analytical, and TNPSC-oriented. • Questions should be generated from important facts, concepts, schemes, reports, constitutional articles, years, causes, impacts, and analytical points from the PDF. • Avoid repetitive questions. • Maintain moderate to high difficulty level. • Wrong options should be believable and tricky. • Avoid directly obvious answers. • Questions should feel like actual TNPSC official question paper questions. Strict Question Format: கூற்று: … காரணம்: … Assertion: … Reason: … 1. Both Assertion and Reason are correct, and Reason is the correct explanation of Assertion. 2. Both Assertion and Reason are correct, but Reason is not the correct explanation of Assertion. 3. Assertion is correct, but Reason is incorrect. 4. Assertion is incorrect, but Reason is correct. Correct Answer: exmaple this method : கூற்று:சமீபத்திய அமெரிக்க இறக்குமதி வரி உயர்வு அறிவிப்பானது தமிழ்நாட்டின் ஜவுளித் துறை பொருளாதாரத்திற்கு பெரும் சவாலாக அமைய வாய்ப்புள்ளது.காரணம்:தமிழ்நாட்டின் ஒட்டுமொத்த ஜவுளி ஏற்றுமதியில் சுமார் 30% அமெரிக்க சந்தையை மட்டுமே நம்பியுள்ளது. Assertion:The recent US import tariff hike announcement is likely to pose a major challenge to Tamil Nadu's textile economy.Reason:Nearly 30% of Tamil Nadu's total textile exports rely entirely on the US market. கூற்று மற்றும் காரணம் இரண்டும் சரி; காரணம், கூற்றிற்கான சரியான விளக்கம்.Both Assertion and Reason are correct, and Reason is the correct explanation of Assertion. கூற்று மற்றும் காரணம் இரண்டும் சரி; ஆனால் காரணம், கூற்றிற்கான சரியான விளக்கம் அல்ல.Both Assertion and Reason are correct, but Reason is not the correct explanation of Assertion. கூற்று சரி; காரணம் தவறு.Assertion is correct, but Reason is incorrect. கூற்று தவறு; காரணம் சரி.Assertion is incorrect, but Reason is correct. சரியான விடை:Correct Answer: கூற்று மற்றும் காரணம் இரண்டும் சரி; காரணம், கூற்றிற்கான சரியான விளக்கம்.Both Assertion and Reason are correct, and Reason is the correct explanation of Assertion. விளக்கம்:தமிழ்நாட்டின் வணிக ஏற்றுமதி $52.07 பில்லியன் என்ற அளவில் வலுவாக இருந்தாலும், திருப்பூர் போன்ற ஜவுளி நகரங்கள் ஏற்றுமதியை பெரிதும் நம்பியுள்ளன. அமெரிக்காவின் 50% கட்டண உயர்வு நேரடியாக 30% அமெரிக்க ஜவுளி ஏற்றுமதியைப் பாதிக்கும் என்பதால் இக்கூற்று மற்றும் காரணம் சரியானதாகும்."
