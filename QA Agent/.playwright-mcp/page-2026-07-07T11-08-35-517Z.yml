            - rowgroup [ref=f15e211]:
              - row " 0005 Kingdom - 2026 இந்த Batch குரூப் 1 மற்றும் குரூப் 2 ஆகியவற்றின் Prelims மற்றும் குரூப் 4 தேர்வுகளுக்கான திருத்தி அமைக்கப்பட்ட புதிய பாடத்திட்டத்தின்படி நடத்தப்படும். இந்த Batchல் வகுப்புகள் Recorded வீடியோக்களாக வழங்கப்படும்; வாரத்திற்கு நான்கு நாட்கள் வகுப்புகள் இருக்கும். வார இறுதியில் 100 கேள்விகளுக்கான வார இறுதி தேர்வு நடத்தப்படும். வகுப்புகள் மற்றும் தேர்வுகள் bilingual ஆக நடத்தப்படும். ஒவ்வொரு மாதமும் மாத இறுதியில் அம்மாதத்திற்கான தேர்வு 200 கேள்விகளுக்கு நடைபெறும். ஒவ்வொரு மாதத்திற்கான நடப்பு நிகழ்வுகளும் (Current Affairs) அம்மாத இறுதியில் வழங்கப்படும். இந்த Batch தொடர்பான கால அட்டவணைகள் மாறுதலுக்கு உட்பட்டவை (Tentative). இந்த Batch ஆறு மாதம் வரை நடத்தப்படும். இந்த பேட்சின் வீடியோக்களை மாணவர்கள் ஒரு வருடம் வரை பயன்படுத்திக் கொள்ளலாம். இந்த பேட்ச் இன் வகுப்புகள் டிஜிட்டல் PDFஆக வழங்கப்படும். 300 Active 31/10/2025" [ref=f15e212] [cursor=pointer]:
