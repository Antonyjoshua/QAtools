<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="68%" r="50%">
      <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6c63ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softglow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <rect width="100" height="100" rx="22" fill="url(#glow)"/>

  <!-- AJ — bold, centered text using reliable system font -->
  <text
    x="8" y="74"
    font-family="'Segoe UI', 'Arial Black', Arial, Helvetica, sans-serif"
    font-weight="900"
    font-size="56"
    fill="#ffffff"
    letter-spacing="-2">AJ</text>

  <!-- Purple dot (circle, not text — renders crisply at all sizes) -->
  <circle cx="81" cy="70" r="8" fill="#6c63ff" filter="url(#softglow)"/>
  <!-- Inner highlight -->
  <circle cx="78.5" cy="67.5" r="2.8" fill="#a78bfa" opacity="0.8"/>
</svg>
