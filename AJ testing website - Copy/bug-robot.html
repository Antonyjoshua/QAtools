<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Bug — Antony Joshua S</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .bug-page {
      min-height: calc(100vh - 64px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 24px 60px;
    }
    .bug-page-title {
      font-size: 2.6rem; font-weight: 800;
      color: var(--text); text-align: center; margin-bottom: 6px;
    }
    .bug-page-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem; color: var(--text-dim);
      letter-spacing: 0.14em; text-align: center;
      margin-bottom: 36px; text-transform: uppercase;
    }
    .bug-svg-wrap {
      max-width: 540px; width: 100%; position: relative;
    }
    .bug-robot-svg { width: 100%; height: auto; overflow: visible; }

    /* Body part hover */
    .bp {
      cursor: pointer;
      transition: filter 0.18s;
    }
    .bp:hover {
      filter: drop-shadow(0 0 10px rgba(var(--accent-rgb), 0.9))
              drop-shadow(0 0 24px rgba(var(--accent-rgb), 0.45));
    }
    .bp:hover .bp-stroke { stroke: var(--accent2); }
    .bp:hover .bp-fill   { fill: rgba(var(--accent-rgb), 0.22); }
    .bp:hover .bp-dot    { fill: var(--accent2); }

    /* Info card */
    .bug-card {
      position: fixed; z-index: 999;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 18px 22px; max-width: 270px; min-width: 210px;
      pointer-events: none;
      opacity: 0; transform: scale(0.93) translateY(6px);
      transition: opacity 0.18s, transform 0.18s;
      box-shadow: 0 8px 32px rgba(var(--accent-rgb), 0.25), 0 0 0 1px rgba(var(--accent-rgb), 0.2);
    }
    .bug-card.on { opacity: 1; transform: scale(1) translateY(0); }
    .bc-icon  { font-size: 1.7rem; margin-bottom: 8px; display: block; }
    .bc-title { font-size: 0.93rem; font-weight: 700; color: var(--accent2); margin-bottom: 5px; }
    .bc-desc  { font-size: 0.8rem; color: var(--text-muted); line-height: 1.65; }

    /* Pulse animations */
    @keyframes bp-breathe { 0%,100%{opacity:.7} 50%{opacity:1} }
    @keyframes bp-core    { 0%,100%{opacity:.3;r:12} 50%{opacity:.85;r:14} }
    @keyframes bp-eye     { 0%,88%,100%{ry:14} 92%{ry:1.5} }
    @keyframes bp-sting   { 0%,100%{opacity:.5} 50%{opacity:1} }

    .anim-breathe  { animation: bp-breathe 2.2s ease-in-out infinite; }
    .anim-breathe2 { animation: bp-breathe 2.2s ease-in-out infinite 1.1s; }
    .anim-core     { animation: bp-breathe 2.8s ease-in-out infinite; }
    .anim-sting    { animation: bp-sting 1.8s ease-in-out infinite; }
    .eye-scan      { animation: bp-breathe 2s ease-in-out infinite; }

    .bug-footer-note {
      margin-top: 36px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem; color: var(--text-dim);
      text-align: center; opacity: 0.5;
    }
  </style>
</head>
<body>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">

    <div class="bc-desc"  id="bcDesc"></div>

  <script src="theme.js"></script>
  <script src="jarvis.js"></script>
  <script>
    const INFO = {
      experience: {
        icon: '⏱',
        title: '3+ Years Experience',
        desc: 'Left antenna tuned to sense quality issues since 2021 — web, mobile, VR, and AI platforms. Never stops scanning.'
      },
      defects: {
        icon: '🐛',
        title: '2500+ Defects Found',
        desc: 'Right antenna wired to detect every defect. Critical, major, minor — nothing slips past the radar.'
      },
      education: {
        icon: '🎓',
        title: 'MCA — Madras University',
        desc: 'Master of Computer Applications. The analytical brain behind every test plan, strategy, and risk assessment.'
      },
      playwright: {
        icon: '🎭',
        title: 'Playwright + TypeScript',
        desc: 'Left eye: modern automation. Cross-browser, headless, blazing-fast end-to-end tests built for scale.'
      },
      selenium: {
        icon: '🔬',
        title: 'Selenium + Java',
        desc: 'Right eye: 55.5 hours of WebDriver mastery — from basics to full framework architecture.'
      },
      skills: {
        icon: '⚡',
        title: 'Core QA Arsenal',
        desc: 'Power core: Playwright · Selenium · TestNG · JIRA · Postman · API Testing · TypeScript · Java · Git.'
      },
      domains: {
        icon: '🌐',
        title: '8 Domains',
        desc: 'Wings span: E-commerce · Banking · Healthcare · EdTech · VR · AI · Real Estate · Logistics.'
      },
      projects: {
        icon: '📁',
        title: '9+ Projects',
        desc: 'The abdomen carries 9+ completed projects — web apps, mobile platforms, VR environments, AI tools.'
      },
      automation: {
        icon: '🤖',
        title: 'Automation Testing',
        desc: 'Upper limbs for speed: Playwright frameworks, Selenium WebDriver scripts, CI/CD pipeline integration.'
      },
      manual: {
        icon: '🔍',
        title: 'Manual Testing',
        desc: 'Middle limbs for precision: exploratory testing, regression suites, UAT, test case design, defect triage.'
      },
      certs: {
        icon: '🏅',
        title: 'Certifications',
        desc: 'Udemy: Selenium + ML Testing. GUVI × HCL: Automation Skills. Testleaf: QA Master Class. Oct–Dec 2024.'
      },
      passion: {
        icon: '💜',
        title: 'Passion for Quality',
        desc: 'The sting — every product I touch gets injected with quality. Bug hunting is not a job. It\'s instinct.'
      }
    };

    const card  = document.getElementById('bugCard');
    const icEl  = document.getElementById('bcIcon');
    const ttEl  = document.getElementById('bcTitle');
    const dsEl  = document.getElementById('bcDesc');
    let hideT;

    document.querySelectorAll('.bp').forEach(function (part) {
      part.addEventListener('mouseenter', function (e) {
        clearTimeout(hideT);
        var data = INFO[this.dataset.k];
        if (!data) return;
        icEl.textContent = data.icon;
        ttEl.textContent = data.title;
        dsEl.textContent = data.desc;
        place(e);
        card.classList.add('on');
      });
      part.addEventListener('mousemove', place);
      part.addEventListener('mouseleave', function () {
        hideT = setTimeout(function () { card.classList.remove('on'); }, 120);
      });
    });

    function place(e) {
      var mg = 14, cw = card.offsetWidth || 250, ch = card.offsetHeight || 130;
      var x = e.clientX + 22, y = e.clientY - ch / 2;
      if (x + cw > window.innerWidth  - mg) x = e.clientX - cw - 22;
      if (y < mg) y = mg;
      if (y + ch > window.innerHeight - mg) y = window.innerHeight - ch - mg;
      card.style.left = x + 'px';
      card.style.top  = y + 'px';
    }
  </script>
</body>
